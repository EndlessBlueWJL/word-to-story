name: Check workflow and render example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_public_files.py --worktree
      - run: python -m wordstory fonts
      - run: python -m unittest discover -s tests -v
      - run: python -m wordstory demo --data ./data/ci
      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.os }}
          path: data/ci/demos/**/build-*/*.png
